<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贖回完成</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #0a0f1c;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      background-color: #bc8844;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }

    .topbar img {
      height: 40px;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .container h1 {
      color: #bc8844;
      margin-bottom: 20px;
    }

    .container button {
      background-color: #bc8844;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .container button:hover {
      background-color: #a86f32;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="logo_text.png" alt="麥可曼尼" />
    <div>
      <a href="index.html" style="color:white; text-decoration:none;">登出</a>
    </div>
  </div>

  <div class="container">
    <h1>贖回成功！</h1>
    <p>您已成功完成基金贖回，款項將於預定時間內入帳。</p>
    <button onclick="location.href='overview.html'">返回帳戶總覽</button>
  </div>
</body>
</html>
