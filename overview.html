<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>帳戶總覽 - 麥可曼尼</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0a0f1c;
      color: #ffffff;
    }
    .topbar {
      background-color: #bc8844;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar img {
      height: 40px;
    }
    .topbar .logout {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      display: flex;
      height: calc(100vh - 50px);
    }

    .sidebar {
      background-color: #d3954e;
      width: 220px;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      color: #1e1e1e;
    }

    .sidebar a {
      display: block;
      color: #1e1e1e;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      background-color: rgba(255, 255, 255, 0.15);
    }

    .sidebar a:hover {
      background-color: rgba(0, 0, 0, 0.15);
    }

    .content {
      flex: 1;
      padding: 40px;
      box-sizing: border-box;
    }

    .content h2 {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
    }

    .info-table th, .info-table td {
      border-bottom: 1px solid #444;
      padding: 12px;
      text-align: left;
      font-size: 16px;
    }

    .info-table th {
      color: #aaa;
      font-weight: normal;
    }

    .info-table td {
      color: #fff;
    }

  </style>
</head>
<script>
  function toggleSubmenu() {
    const submenu = document.getElementById('trade-submenu');
    submenu.style.display = submenu.style.display === 'none' ? 'block' : 'none';
  }
</script>
<body>

  <div class="topbar">
    <img src="logo_text.png" alt="麥可曼尼">
    <a class="logout" href="index.html">登出</a>
  </div>

  <div class="container">
    <div class="sidebar">
      <h3>功能選單</h3>
  <a href="#">帳戶資訊</a>
  <a href="#">基本資料變更</a>

  <div class="submenu">
    <a href="#" onclick="toggleSubmenu()">在線交易 </a>
    <div id="trade-submenu" style="display: none; margin-left: 10px;">
      <a href="buy.html">申購基金</a>
      <a href="redeem.html">贖回基金</a>
    </div>
  </div>

  <a href="#">定期定額查詢</a>
  <a href="#">歷史交易</a>
  <a href="#">贖回紀錄</a>
  <a href="#">收益配息</a>
  <a href="#">密碼變更</a>
</div>
    <div class="content">
      <h2>帳戶資訊</h2>
      <table class="info-table">
        <tr>
          <th>會員編號</th>
          <td>MF–921348</td>
        </tr>
        <tr>
          <th>姓名</th>
          <td>周佐</td>
        </tr>
        <tr>
          <th>現有資產</th>
          <td>NT$ 0</td>
        </tr>
        <tr>
          <th>淨值</th>
          <td>NT$ 0</td>
        </tr>
      </table>
    </div>
  </div>

</body>
</html>
