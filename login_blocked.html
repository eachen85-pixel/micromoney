<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>帳號已被封鎖</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #0a0f1c;
      color: white;
    }

    .topbar {
      background-color: #bc8844;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }

    .topbar img {
      height: 40px;
    }

    .container {
      max-width: 600px;
      margin: 100px auto;
      text-align: center;
      padding: 30px;
      background-color: #1a1f2c;
      border-radius: 8px;
    }

    h1 {
      color: #ff4d4d;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .button-group button {
      padding: 12px 30px;
      background-color: #bc8844;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .button-group button:hover {
      background-color: #f5c58c;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="logo_text.png" alt="麥可曼尼" />
    <div></div>
  </div>

  <div class="container">
    <h1>帳號已被封鎖</h1>
    <p>由於異常登入或安全問題，您的帳號目前已被封鎖。</p>
    <p>如有疑問，請聯絡線上客服。</p>
    
    <div class="button-group">
      <button onclick="location.href='index.html'">返回首頁</button>
      <button onclick="location.href='support.html'">線上客服</button>
    </div>
  </div>
</body>
</html>
